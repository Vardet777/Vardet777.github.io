<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Linnea"/>
<meta name="theme-color" content="#050506"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/linnea.svg"/>
<title>Linnea</title>
<style>
:root{--ember:#e07a4a;--ink:#f3e6dc;--muted:#9a8078}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050506;color:var(--ink);font-family:Georgia,serif}
body{display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{width:48px;height:48px;border-radius:50%;background:#3a1616;border:1px solid var(--ember)}
strong{color:var(--ember)}
#status{font:12px ui-sans-serif,system-ui;color:var(--muted)}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:160px}
.msg{max-width:90%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.4}
.linnea{align-self:flex-start;background:#1c0f0eee}
.you{align-self:flex-end;background:#3a1616ee}
.plugins{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.plugins button{background:#1c0f0eee;color:var(--ink);border:1px solid #3a2220;border-radius:999px;padding:8px 12px;font:600 12px ui-sans-serif,system-ui}
#t{width:100%;padding:13px 14px;border-radius:16px;border:1px solid #4a2a24;background:#0c0808;color:var(--ink);font-size:16px}
.row{display:flex;gap:8px;margin-top:8px}
button.main{flex:1;background:var(--ember);color:#1a0c08;border:0;border-radius:16px;padding:14px;font:600 16px ui-sans-serif,system-ui}
button.ghost{flex:1;background:#120c0c;color:var(--ink);border:1px solid #3a2220;border-radius:16px;padding:14px;font:600 16px ui-sans-serif,system-ui}
.hint{font:12px ui-sans-serif,system-ui;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="av" aria-hidden="true"></div>
  <div><strong>Linnea</strong><div id="status">v27 · lokal · ingen nyckel</div></div>
</header>
<div id="log"></div>
<div class="plugins" id="plugins">
  <button type="button" data-cmd="minne">Minne</button>
  <button type="button" data-cmd="klarhet">Klarhet</button>
  <button type="button" data-cmd="beslut">Beslut</button>
  <button type="button" data-cmd="plan">Plan</button>
  <button type="button" data-cmd="fokus">Fokus</button>
  <button type="button" data-cmd="juridiken">Juridiken</button>
</div>
<form id="f">
  <input id="t" placeholder="skriv en mening, t.ex. kaffet klockan åtta" autocomplete="off"/>
  <div class="row">
    <button class="main" type="submit">Skicka</button>
    <button class="ghost" type="button" id="talk">Prata</button>
    <button class="ghost" type="button" id="mic">Lyssna</button>
  </div>
</form>
<p class="hint" id="hint">En mening du skriver sparas. Tryck Prata för att höra.</p>
<script>
(function () {
  var KEY = "linnea.facts.v27";
  var log = document.getElementById("log");
  var input = document.getElementById("t");
  var hint = document.getElementById("hint");
  var status = document.getElementById("status");
  function facts() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function saveFact(text) {
    var list = facts();
    if (!list.some(function (f) { return f.toLowerCase() === text.toLowerCase(); })) {
      list.push(text);
      localStorage.setItem(KEY, JSON.stringify(list.slice(-80)));
    }
  }
  function add(role, text) {
    var d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    log.appendChild(d);
    d.scrollIntoView({ block: "end" });
  }
  function lastLinnea() {
    var nodes = log.querySelectorAll(".msg.linnea");
    return (nodes[nodes.length - 1] && nodes[nodes.length - 1].textContent) || "Hej. Jag är Linnea.";
  }
  function pickVoice() {
    var list = [];
    try { list = speechSynthesis.getVoices() || []; } catch (e) {}
    var pick = null;
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      var blob = ((v.name || "") + " " + (v.lang || "")).toLowerCase();
      if (/evie|zelda|oskar|ingmar|erik|magnus/.test(blob)) continue;
      if (/^sv/.test(v.lang || "") && /alva|elin|klara|ebba|sofie|freja/.test(blob)) return v;
      if (!pick && /^sv/.test(v.lang || "")) pick = v;
    }
    return pick;
  }
  function speak(text) {
    if (!window.speechSynthesis) { hint.textContent = "Ingen uppläsning i den här Safari."; return; }
    var clean = String(text || "").replace(/\s+/g, " ").trim();
    if (!clean) return;
    try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(clean.slice(0, 900));
    u.lang = "sv-SE";
    u.rate = 0.98;
    var v = pickVoice();
    if (v) u.voice = v;
    status.textContent = "v27 · lokal · " + ((v && v.name) || "sv-SE");
    speechSynthesis.speak(u);
  }
  function reply(t) {
    t = String(t || "").trim();
    if (/^minne\b/i.test(t)) {
      var list = facts();
      return list.length ? "Minne:\n- " + list.join("\n- ") : "Minnet är tomt.";
    }
    if (/^klarhet/i.test(t)) return "Klarhet: den här sidan är Linnea på telefonen. En mening sparas. Prata läser upp.";
    if (/^beslut/i.test(t)) return "Beslut: sajten är förhandsvisning. Drive väntar på lundgrennisse@gmail.com.";
    if (/^plan/i.test(t)) return "Plan: skriv en mening. Tryck Prata.";
    if (/^fokus/i.test(t)) return "Fokus: minne och röst på iPhone.";
    if (/^juridiken/i.test(t)) return "IP Vardet777. Inte juridisk rådgivning.";
    if (/^(vad kan du|hjälp|plugins)/i.test(t)) return "Jag sparar meningar och läser upp dem. Säg minne för listan.";
    var m = t.match(/^(kom ihåg|minns|spara)\s*[:\-]?\s*(.+)$/i);
    var fact = m ? m[2] : t;
    saveFact(fact);
    return "Sparat: " + fact;
  }
  function send(text) {
    if (!text) { speak(lastLinnea()); return; }
    add("you", text);
    var out = reply(text);
    add("linnea", out);
    speak(out);
  }
  add("linnea", "Hej. Jag är Linnea. Skriv kaffet klockan åtta — jag sparar meningen. Tryck Prata för att höra.");
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    input.value = "";
    send(text);
  });
  document.getElementById("talk").addEventListener("click", function () {
    try { speechSynthesis.resume(); } catch (e) {}
    speak(lastLinnea());
  });
  document.getElementById("mic").addEventListener("click", function () {
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) { add("linnea", "Ingen diktering. Skriv i stället."); return; }
    var rec = new Rec();
    rec.lang = "sv-SE";
    rec.onresult = function (ev) { send(ev.results[0][0].transcript); };
    try { rec.start(); } catch (e) {}
  });
  document.getElementById("plugins").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-cmd]");
    if (b) send(b.getAttribute("data-cmd"));
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js?v=27");
  }
})();
</script>
</body>
</html>
