<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Free-Plugins — inloggning</title>
<link rel="stylesheet" href="./css/site.css"/>
<link rel="stylesheet" href="./css/photos.css"/>
</head>
<body>
  <main class="gate">
    <img src="./img/linnea-lace.jpg" alt="Linnea" onerror="this.style.opacity=0"/>
    <div class="inner">
      <p class="kicker">Verkstad</p>
      <h1>Inloggningsvägg</h1>
      <p>Sajten är inte publicerad som produkt. Öppna bara om du är ägaren.</p>
      <p class="hint">Ingen kontosäkerhet. En vägg så sidan inte behandlas som live.</p>
      <p style="margin-top:18px"><button type="button" id="enter">Öppna verkstad</button></p>
      <p class="hint">Agent: Linnea. Kent är ersatt. Delat minne + röst inne.</p>
    </div>
  </main>
  <script type="module">
    import { enterWorkshop, signedIn } from "./js/auth.js";
    if (signedIn()) location.replace("./index.html");
    document.getElementById("enter").addEventListener("click", enterWorkshop);
  </script>
</body>
</html>
