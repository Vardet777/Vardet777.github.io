<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Free Plugins — Test Lab</title>
</head>
<body>
  <main>
    <h1>Plugin Test Lab</h1>
    <p>Välj en plugin och testa den live med Kent i en isolerad gästscession.</p>
    <label for="plugin">Plugin</label>
    <select id="plugin">
      <option value="demo-plugin">Demo Plugin</option>
    </select>
    <button id="test" type="button">Testa live med Kent</button>
    <pre id="result" aria-live="polite"></pre>
  </main>
  <script type="module">
    import { createKentGuestTest } from "./js/kent-guest.js";

    const result = document.querySelector("#result");
    document.querySelector("#test").addEventListener("click", () => {
      const decision = createKentGuestTest({
        session: { id: crypto.randomUUID(), status: "active", expires_at: Date.now() + 300000 },
        policy: { plugin_id: document.querySelector("#plugin").value, guest_test_enabled: true, execution_mode: "sandbox" }
      });
      result.textContent = decision.allowed
        ? `Kent är redo att köra ${decision.plugin_id} i ${decision.execution_mode}-läge.`
        : `Test nekades: ${decision.reason}`;
    });
  </script>
</body>
</html>
