<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Free-Plugins — pack</title>
<link rel="stylesheet" href="./css/site.css"/>
</head>
<body>
  <div class="wrap">
    <header class="top" id="site-header"></header>
    <p class="kicker">Pack</p>
    <h1>Free-Plugins hem först.</h1>
    <pre class="card" id="pack" style="overflow:auto;font:13px ui-monospace,monospace"></pre>
    <footer id="site-footer"></footer>
  </div>
  <script type="module">
    import "./js/shell.js";
    const el = document.getElementById("pack");
    const res = await fetch("./packs/free-plugins-hem-v1.json", { cache: "no-store" });
    el.textContent = JSON.stringify(await res.json(), null, 2);
  </script>
</body>
</html>
