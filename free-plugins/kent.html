<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Free-Plugins — Kent</title>
<link rel="stylesheet" href="./css/site.css?v=26"/>
<link rel="stylesheet" href="./css/photos-a.css?v=26"/>
<link rel="stylesheet" href="./css/photos.css?v=26"/>
</head>
<body>
  <div class="wrap">
    <header class="top" id="site-header"></header>
    <p class="kicker">Kent</p>
    <h1>En egen agent.</h1>
    <div class="stage">
      <div class="portrait photo-lace" role="img" aria-label="Kent"></div>
      <div class="card">
        <div class="status">
          <span><i class="dot on"></i> agent</span>
          <span><i class="dot" id="mdot"></i> eget minne</span>
          <span id="src">lokal service</span>
        </div>
        <div class="log" id="log">
          <div class="msg linnea">Hej. Jag är Kent. Jag är en separat agent från Linnea och har en egen minnesgrund.</div>
        </div>
        <form class="stack" id="f" style="margin-top:12px">
          <input id="t" placeholder="skriv till Kent" autocomplete="off"/>
        </form>
        <div class="plugin-dock" id="plugins" aria-label="Kent-kommandon">
          <button type="button" data-cmd="minne">Minne</button>
          <button type="button" data-cmd="klarhet">Klarhet</button>
          <button type="button" data-cmd="fokus">Fokus</button>
          <button type="button" data-cmd="risk">Risk</button>
        </div>
        <div class="talk-dock">
          <button type="button" id="talk">Prata</button>
          <button type="submit" form="f">Skicka</button>
          <button type="button" class="ghost" id="mic">Lyssna</button>
        </div>
        <p class="hint" id="hint">Kent är en egen agent med egen minnesgrund. Linneas privata minne läses inte.</p>
      </div>
    </div>
    <footer id="site-footer"></footer>
  </div>
  <script>
    (function () {
      var log = document.getElementById("log");
      var input = document.getElementById("t");
      var hint = document.getElementById("hint");
      function lastText() {
        var nodes = log.querySelectorAll(".msg.linnea");
        var n = nodes[nodes.length - 1];
        return (n && n.textContent) || "Hej. Jag är Kent.";
      }
      function add(role, text) {
        var d = document.createElement("div");
        d.className = "msg " + role;
        d.textContent = text;
        log.appendChild(d);
        d.scrollIntoView({ block: "end" });
      }
      function speak(text) {
        if (!window.speechSynthesis) { if (hint) hint.textContent = "Den här webbläsaren har ingen uppläsning."; return; }
        var clean = String(text || "").replace(/\s+/g, " ").trim();
        if (!clean) return;
        try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch (e) {}
        var u = new SpeechSynthesisUtterance(clean.slice(0, 900));
        u.lang = "sv-SE"; u.rate = 0.98; u.pitch = 0.97;
        speechSynthesis.speak(u);
      }
      window.__kentSpeak = speak;
      window.__kentAdd = add;
      document.getElementById("talk").addEventListener("click", function () { speak(lastText()); });
      document.getElementById("f").addEventListener("submit", function (e) {
        e.preventDefault();
        var text = (input.value || "").trim();
        input.value = "";
        if (!text) { speak(lastText()); return; }
        add("you", text);
        if (typeof window.__kentAnswer === "function") window.__kentAnswer(text);
        else { add("linnea", "Sparat: " + text); speak("Sparat: " + text); }
      });
      var plug = document.getElementById("plugins");
      if (plug) plug.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-cmd]");
        if (!btn) return;
        input.value = btn.getAttribute("data-cmd");
        document.getElementById("f").requestSubmit();
      });
      document.getElementById("mic").addEventListener("click", function () {
        var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) { add("linnea", "Ingen diktering. Skriv i stället."); return; }
        var rec = new Rec();
        rec.lang = "sv-SE";
        rec.onresult = function (ev) { input.value = ev.results[0][0].transcript; document.getElementById("f").requestSubmit(); };
        try { rec.start(); } catch (err) {}
      });
    })();
  </script>
  <script type="module">
    import "./js/shell.js?v=26";
    import { answer } from "./js/kent.js?v=26";
    import { loadAgentBank } from "./js/memory.js?v=26";
    window.__kentAnswer = async function (text) {
      try {
        const out = await answer(text);
        window.__kentAdd("linnea", out.text);
        window.__kentSpeak(out.text);
        document.getElementById("src").textContent = out.provider || out.source || "lokal service";
      } catch {
        window.__kentAdd("linnea", "Sparat: " + text);
        window.__kentSpeak("Sparat: " + text);
      }
    };
    try {
      const bank = loadAgentBank("kent");
      document.getElementById("mdot").classList.toggle("on", bank.facts.length + bank.events.length > 0);
    } catch (e) {}
  </script>
</body>
</html>
