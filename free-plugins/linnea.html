<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Free-Plugins — Linnea</title>
<link rel="stylesheet" href="./css/site.css?v=22"/>
<link rel="stylesheet" href="./css/photos-a.css?v=22"/>
<link rel="stylesheet" href="./css/photos.css?v=22"/>
</head>
<body>
  <div class="wrap">
    <header class="top" id="site-header"></header>
    <p class="kicker">Linnea</p>
    <h1>Röst och service.</h1>
    <div class="stage">
      <div class="portrait photo-lace" role="img" aria-label="Linnea"></div>
      <div class="card">
        <div class="status">
          <span><i class="dot" id="vdot"></i> röst</span>
          <span><i class="dot" id="mdot"></i> minne</span>
          <span id="src">lokal service</span>
        </div>
        <div class="log" id="log">
          <div class="msg linnea">Hej. Jag är Linnea. Tryck den orange knappen Prata så läser jag upp. Ingen nyckel behövs.</div>
        </div>
        <form class="stack" id="f" style="margin-top:12px">
          <input id="t" placeholder="skriv här eller tryck Prata" autocomplete="off"/>
        </form>
        <div class="talk-dock">
          <button type="button" id="talk">Prata</button>
          <button type="submit" form="f">Skicka</button>
          <button type="button" class="ghost" id="mic">Lyssna</button>
        </div>
        <p class="hint">Service fungerar utan nyckel. Groq är valfritt.</p>
        <form class="stack" id="groq-form">
          <label>Groq-nyckel (valfritt)
            <input id="groq-key" type="password" autocomplete="off" placeholder="gsk_…"/>
          </label>
          <button type="submit" class="ghost">Spara Groq</button>
        </form>
        <p class="hint">Hämta på <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. Klistra in i rutan. Stannar i den här Safari.</p>
      </div>
    </div>
    <footer id="site-footer"></footer>
  </div>
  <script type="module">
    import "./js/shell.js";
    import { loadCatalog } from "./js/catalog.js";
    import { loadAllPacks } from "./js/pack.js";
    import { answer } from "./js/linnea.js";
    import { getKey, setKey, liveQueue } from "./js/providers.js";
    import { loadBank } from "./js/memory.js";
    import {
      speak, stopSpeak, listenOnce, voiceWanted, setVoiceWanted,
      canListen, holdAudioSession, whenVoicesReady, voiceLabel
    } from "./js/voice.js";
    const log = document.getElementById("log");
    const input = document.getElementById("t");
    const talk = document.getElementById("talk");
    let catalog = { items: [] };
    let packs = [];
    function lastLinnea() {
      const nodes = [...log.querySelectorAll(".msg.linnea")];
      return nodes.pop()?.textContent || "Hej. Jag är Linnea.";
    }
    function add(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + role;
      d.textContent = text;
      log.appendChild(d);
      d.scrollIntoView({ block: "end" });
    }
    function markVoice() {
      document.getElementById("vdot").classList.toggle("on", voiceWanted());
      const q = liveQueue();
      document.getElementById("src").textContent =
        (q.length ? "kö " + q.map((p) => p.label).join(" → ") : "lokal service") +
        " · " + voiceLabel();
    }
    talk.addEventListener("click", (e) => {
      e.preventDefault();
      holdAudioSession();
      setVoiceWanted(true);
      speak(lastLinnea());
      markVoice();
    });
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      holdAudioSession();
      const text = input.value.trim();
      input.value = "";
      send(text);
    });
    document.getElementById("mic").addEventListener("click", () => {
      if (!canListen()) {
        add("linnea", "Den här Safari-versionen har ingen diktering. Skriv, eller använd tangentbordets mikrofon.");
        return;
      }
      listenOnce({
        onStart() { document.getElementById("mic").classList.add("live"); },
        onResult(text) {
          document.getElementById("mic").classList.remove("live");
          input.value = text;
          send(text);
        },
        onError() { document.getElementById("mic").classList.remove("live"); }
      });
    });
    document.getElementById("groq-key").value = getKey("groq");
    document.getElementById("groq-form").addEventListener("submit", (e) => {
      e.preventDefault();
      setKey("groq", document.getElementById("groq-key").value);
      markVoice();
      add("linnea", getKey("groq") ? "Groq sparad i den här Safari." : "Groq borttagen. Jag kör lokalt.");
    });
    async function send(text) {
      if (!text) return;
      add("you", text);
      try {
        const out = await answer(text, catalog, packs);
        add("linnea", out.text);
        document.getElementById("mdot").classList.add("on");
        speak(out.text);
        markVoice();
      } catch {
        add("linnea", "Jag är här. Tryck Prata eller skriv igen.");
        speak("Jag är här. Tryck Prata eller skriv igen.");
      }
    }
    markVoice();
    whenVoicesReady().then(markVoice);
    try {
      catalog = await loadCatalog();
      const packRows = await loadAllPacks(catalog);
      packs = packRows.map((r) => r.pack).filter(Boolean);
      const bank = loadBank();
      document.getElementById("mdot").classList.toggle("on", bank.facts.length + bank.events.length > 0);
      markVoice();
    } catch {}
  </script>
</body>
</html>
