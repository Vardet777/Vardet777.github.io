<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Free-Plugins — Linnea</title>
<link rel="stylesheet" href="./css/site.css?v=21"/>
<link rel="stylesheet" href="./css/photos-a.css?v=21"/>
<link rel="stylesheet" href="./css/photos.css?v=21"/>
</head>
<body>
  <div class="wrap">
    <header class="top" id="site-header"></header>
    <p class="kicker">Linnea</p>
    <h1>Röst, test och delat minne.</h1>
    <div class="stage">
      <div class="portrait photo-lace" role="img" aria-label="Linnea"></div>
      <div class="card">
        <div class="status">
          <span><i class="dot" id="vdot"></i> röst</span>
          <span><i class="dot" id="mdot"></i> minne</span>
          <span id="src">källa: lokal</span>
        </div>
        <div class="log" id="log"></div>
        <form class="stack" id="f" style="margin-top:12px">
          <input id="t" placeholder="vad kan du · kom ihåg: · testa: Free-Plugins hem" autocomplete="off"/>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="submit">Skicka</button>
            <button type="button" class="ghost" id="talk">Prata</button>
            <button type="button" class="ghost" id="mic">Lyssna</button>
            <button type="button" class="ghost" id="voice">Röst på</button>
          </div>
        </form>
        <p class="hint" style="margin-top:10px">Tryck Prata för att höra. iPhone kräver ett tryck. Svensk kvinnlig systemröst, inte EVIE eller ZELDA.</p>
      </div>
    </div>
    <footer id="site-footer"></footer>
  </div>
  <script type="module">
    import "./js/shell.js";
    import { loadCatalog } from "./js/catalog.js";
    import { loadAllPacks } from "./js/pack.js";
    import { answer } from "./js/linnea.js";
    import { liveQueue } from "./js/providers.js";
    import { loadBank } from "./js/memory.js";
    import { speak, stopSpeak, listenOnce, voiceWanted, setVoiceWanted, canListen, holdAudioSession, whenVoicesReady, voiceLabel } from "./js/voice.js";
    const log = document.getElementById("log");
    const input = document.getElementById("t");
    const catalog = await loadCatalog();
    const packRows = await loadAllPacks(catalog);
    const packs = packRows.map((r) => r.pack).filter(Boolean);
    const bank = loadBank();
    document.getElementById("mdot").classList.toggle("on", bank.facts.length + bank.events.length > 0);
    document.getElementById("vdot").classList.toggle("on", voiceWanted());
    document.getElementById("voice").textContent = voiceWanted() ? "Röst på" : "Röst av";
    const live = liveQueue();
    document.getElementById("src").textContent = live.length ? "kö: " + live.map((p) => p.label).join(" → ") : "källa: lokal";
    if (!canListen()) document.getElementById("mic").disabled = true;
    await whenVoicesReady();
    document.getElementById("src").textContent += " · röst " + voiceLabel();
    function add(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + role;
      d.textContent = text;
      log.appendChild(d);
      d.scrollIntoView({ block: "end" });
    }
    add("linnea", "Hej. Jag är Linnea. Kent är ersatt. Tryck Prata så läser jag högt.");
    async function send(text) {
      if (!text) return;
      add("you", text);
      const out = await answer(text, catalog, packs);
      add("linnea", out.text);
      document.getElementById("src").textContent = "källa: " + out.source + " · röst " + voiceLabel();
      document.getElementById("mdot").classList.add("on");
      speak(out.text);
    }
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      holdAudioSession();
      const text = input.value.trim();
      input.value = "";
      send(text);
    });
    document.getElementById("talk").addEventListener("click", () => {
      holdAudioSession();
      const last = [...log.querySelectorAll(".msg.linnea")].pop();
      if (last) speak(last.textContent);
    });
    document.getElementById("voice").addEventListener("click", () => {
      const next = !voiceWanted();
      setVoiceWanted(next);
      document.getElementById("voice").textContent = next ? "Röst på" : "Röst av";
      document.getElementById("vdot").classList.toggle("on", next);
      if (!next) stopSpeak();
    });
    document.getElementById("mic").addEventListener("click", () => {
      listenOnce({
        onStart() { document.getElementById("mic").classList.add("live"); },
        onResult(text) {
          document.getElementById("mic").classList.remove("live");
          input.value = text;
          send(text);
        },
        onError() { document.getElementById("mic").classList.remove("live"); }
      });
    });
  </script>
</body>
</html>
